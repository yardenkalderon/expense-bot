<!doctype html>
<html>
<body>
<script>
  // רכיב Streamlit מינימלי ששומר/קורא/מוחק את טוקן הכניסה ב-localStorage.
  // נדרש כי קיצור דרך במסך הבית בכרום פותח את "/" (start_url של Streamlit Cloud)
  // ולכן הטוקן לא מגיע בכתובת.
  const KEY = "expense_dashboard_token";
  let lastSent = null;

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    let value = "";
    try {
      if (args.action === "get") {
        value = localStorage.getItem(KEY) || "";
      } else if (args.action === "set") {
        localStorage.setItem(KEY, args.token);
        value = "saved";
      } else if (args.action === "clear") {
        localStorage.removeItem(KEY);
        value = "cleared";
      }
    } catch (e) {
      value = "";  // localStorage חסום (למשל גלישה פרטית) — מתנהגים כאילו אין טוקן
    }
    // שולחים רק כשהערך השתנה, אחרת כל rerun היה גורם ל-rerun נוסף
    if (value !== lastSent) {
      lastSent = value;
      send("streamlit:setComponentValue", { value: value, dataType: "json" });
    }
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
